<!doctype html>
<meta charset="utf-8">
<title>CLIP 브라우저 확인</title>
<!--
  실제 브라우저의 onnxruntime-web(wasm)으로 CLIP을 돌려, eval이 저장한 점수와 같은지 · 한 장에 몇 ms인지 본다.
  확장 없이 extension/ 폴더를 그대로 띄워서 연다:
    python3 -m http.server 8766 --bind 127.0.0.1 -d extension   →   http://127.0.0.1:8766/test/clip-browser.html
  필요한 것: fetch-deps.sh가 채운 vendor/ · models/ 와, 확인용 프레임 models/check_c018_*.rgb · check_c018.json
  (프레임은 저장소에 없다 — 만드는 법은 PR 설명).
  경로는 offscreen.js와 같다: clipCrop(페이지) → clipNormalize → 세션 → clipHeads.
-->
<pre id="out">돌리는 중…</pre>
<script src="../vendor/ort.wasm.min.js"></script>
<script>window.SB = {};</script>
<script src="../src/clip-prep.js"></script>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  try {
    ort.env.wasm.wasmPaths = '../vendor/';
    ort.env.wasm.numThreads = 1;
    const heads = await (await fetch('../models/clip_heads.json')).json();
    const t0 = performance.now();
    const sess = await ort.InferenceSession.create('../models/clip_visual.onnx', { executionProviders: ['wasm'] });
    log(`모델 로드 ${Math.round(performance.now() - t0)} ms · 입력 ${sess.inputNames} · 출력 ${sess.outputNames}`);
    const check = await (await fetch('../models/check_c018.json')).json();
    const res = { ok: true, frames: [] };
    for (const [i, c] of Object.entries(check)) {
      const rgb = new Uint8Array(await (await fetch(`../models/check_c018_${i}.rgb`)).arrayBuffer());
      const a = performance.now();
      const crop = SB.clipCrop(rgb, c.w, c.h);
      const b = performance.now();
      const x = SB.clipNormalize(crop);
      const runs = [];
      let emb;
      for (let k = 0; k < 3; k++) {
        const r0 = performance.now();
        const o = await sess.run({ [sess.inputNames[0]]: new ort.Tensor('float32', x, [1, 3, 224, 224]) });
        runs.push(Math.round(performance.now() - r0));
        emb = o[sess.outputNames[0]].data;
      }
      const s = SB.clipHeads(emb, heads);
      const diff = Math.max(...Object.keys(c.expected).map((k) => Math.abs(s.zs[k] - c.expected[k])),
        Math.abs(s.probe.blood - c.expected_probe_blood));
      res.frames.push({ frame: +i, zs: s.zs, probe: s.probe, expected: c.expected,
        expected_probe: c.expected_probe_blood, maxDiff: diff, crop_ms: Math.round(b - a), run_ms: runs });
      if (diff > 1e-3) res.ok = false;
      log(`c018 t=${i}s · 자르기 ${Math.round(b - a)} ms · 추론 ${runs.join('/')} ms · 최대 차이 ${diff.toExponential(2)}`);
      log(`  피 ${s.zs.blood.toFixed(4)} (기대 ${c.expected.blood.toFixed(4)}) · 보강 ${s.probe.blood.toFixed(4)} (기대 ${c.expected_probe_blood.toFixed(4)})`);
    }
    log(res.ok ? '✓ eval 점수와 같다' : '✗ 차이가 크다');
    window.result = res;
  } catch (e) {
    log('실패: ' + (e?.message || e));
    window.result = { ok: false, error: String(e?.message || e) };
  }
})();
</script>
